{% load static %}
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>{% block title %}بوابة العميل — ConnectOS{% endblock %}</title>
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800;900&family=Plus+Jakarta+Sans:wght@700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20,400,0,0&display=block">
<link rel="stylesheet" href="{% static 'css/style.css' %}">
<style>
  body{display:flex;align-items:center;justify-content:center;min-height:100vh;padding:20px;}
  .portal-wrap{width:100%;max-width:440px;}
  .portal-card{
    background:var(--bg-card); backdrop-filter:blur(24px); -webkit-backdrop-filter:blur(24px);
    border:1px solid var(--glass-strong); border-radius:24px; padding:32px;
    box-shadow:0 25px 70px -20px rgba(0,10,40,.55);
  }
  .portal-brand{display:flex;align-items:center;justify-content:center;gap:8px;text-align:center;margin-bottom:24px;color:#fff;}
  .portal-brand .material-symbols-outlined{font-size:20px;}
  .portal-brand .logo{font-family:'Plus Jakarta Sans',sans-serif;font-weight:800;font-size:20px;color:#fff;}
  .portal-brand .logo span{color:var(--logo-teal,#1d9e75);}
  .portal-brand .sub{font-family:'Tajawal','Cairo',sans-serif;font-weight:500;font-size:13px;color:rgba(255,255,255,.65);}
  .messages{margin-bottom:16px;}
  .msg{padding:10px 14px;border-radius:12px;font-size:13.5px;margin-bottom:8px;backdrop-filter:blur(8px);}
  .msg.error{background:rgba(239,68,68,0.20);color:#FFC2C2;border:1px solid rgba(239,68,68,0.45);}
  .msg.success{background:rgba(16,185,129,0.20);color:#B9FBDE;border:1px solid rgba(16,185,129,0.45);}
</style>
</head>
<body>
  <div class="portal-wrap">
    <div class="portal-brand">
      <span class="material-symbols-outlined">wifi</span>
      <span class="logo">Connect<span>OS</span></span>
      <span class="sub">— بوابة العميل</span>
    </div>
    <div class="portal-card">
      {% if messages %}
      <div class="messages">
        {% for m in messages %}<div class="msg {{ m.tags }}">{{ m }}</div>{% endfor %}
      </div>
      {% endif %}
      {% block content %}{% endblock %}
    </div>
  </div>
</body>
</html>
