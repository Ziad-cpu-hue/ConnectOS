{% extends "base.html" %}
{% block page_title %}تأكيد الحذف{% endblock %}
{% block content %}
<div class="panel" style="max-width:480px;">
  <p style="margin-bottom:20px;">هل أنت متأكد من حذف باقة "<strong>{{ plan.name }}</strong>"؟</p>
  <form method="post">
    {% csrf_token %}
    <button type="submit" class="btn btn-danger">تأكيد الحذف</button>
    <a href="{% url 'plans:list' %}" class="btn btn-ghost">إلغاء</a>
  </form>
</div>
{% endblock %}
