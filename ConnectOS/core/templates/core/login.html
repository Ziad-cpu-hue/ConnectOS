{% load static %}
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>تسجيل الدخول — ConnectOS</title>
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="{% static 'css/style.css' %}">
</head>
<body>
<div class="auth-wrap">
  <div class="auth-card">
    <div class="auth-logo"><span class="dot"></span> ConnectOS</div>
    <div class="auth-sub">سجّل دخولك لإدارة شبكتك</div>

    {% if form.errors %}
      <ul class="errorlist">
        <li>اسم المستخدم أو كلمة المرور غير صحيحة.</li>
      </ul>
    {% endif %}

    <form method="post">
      {% csrf_token %}
      <div class="form-group">
        <label for="id_username">اسم المستخدم</label>
        <input class="field" type="text" name="username" id="id_username" placeholder="أدخل اسم المستخدم" required>
      </div>
      <div class="form-group">
        <label for="id_password">كلمة المرور</label>
        <input class="field" type="password" name="password" id="id_password" placeholder="••••••••" required>
      </div>
      <button type="submit" class="btn btn-primary btn-block">تسجيل الدخول</button>
    </form>
    <p style="text-align:center;font-size:13px;margin-top:12px;">
      <a href="{% url 'core:password_reset' %}" style="color:var(--text-muted);">نسيت كلمة المرور؟</a>
    </p>
    <p style="text-align:center;font-size:13.5px;color:var(--text-muted);margin-top:18px;">
      مفيش حساب لسه؟ <a href="{% url 'core:signup' %}" style="color:var(--teal-light);">ابدأ اشتراكك الآن</a>
    </p>
  </div>
</div>
</body>
</html>
