{% load static %}
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>استعادة كلمة المرور — ConnectOS</title>
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="{% static 'css/style.css' %}">
</head>
<body>
<div class="auth-wrap">
  <div class="auth-card">
    <div class="auth-logo"><span class="dot"></span> ConnectOS</div>
    <div class="auth-sub">هنبعتلك رابط لاستعادة كلمة المرور على بريدك الإلكتروني</div>
    <form method="post">
      {% csrf_token %}
      <div class="form-group">
        <label for="id_email">البريد الإلكتروني</label>
        <input class="field" type="email" name="email" id="id_email" required>
      </div>
      <button type="submit" class="btn btn-primary btn-block">إرسال رابط الاستعادة</button>
    </form>
    <p style="text-align:center;font-size:13.5px;color:var(--text-muted);margin-top:18px;">
      <a href="{% url 'core:login' %}" style="color:var(--teal-light);">الرجوع لتسجيل الدخول</a>
    </p>
  </div>
</div>
</body>
</html>
